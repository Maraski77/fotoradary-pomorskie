<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mapa fotoradarów – Pomorskie</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<style>
  body { margin:0; font-family:Arial; }
  .layout { display:flex; height:100vh; }

  .panel {
    padding:10px;
    background:#f5f5f5;
    color:#000;
    width:300px;
    overflow-y:auto;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:background 0.3s,color 0.3s;
  }
  .panel.dark { background:#1e1e1e; color:#eee; }

  #map { flex:1; height:100%; }

  .legend div { margin:4px 0; }
  .radar-list, .opp-list {
    max-height:200px;
    overflow-y:auto;
    background:#fff;
    border-radius:5px;
    padding:5px;
  }
  .panel.dark .radar-list,
  .panel.dark .opp-list {
    background:#2a2a2a;
    color:#eee;
  }

  .radar-item, .opp-item {
    cursor:pointer;
    padding:5px;
    border-bottom:1px solid #ddd;
    font-size:14px;
  }
  .panel.dark .radar-item,
  .panel.dark .opp-item {
    border-bottom:1px solid #444;
  }
  .radar-item:hover, .opp-item:hover { background:#e0e0e0; }
  .panel.dark .radar-item:hover,
  .panel.dark .opp-item:hover { background:#333; }

  .icon { font-size:18px; margin-right:4px; }
</style>
</head>

<body>

<div class="layout">

  <div class="panel" id="panel">
    <h2>Fotoradary – Pomorskie</h2>

    <input type="text" id="search" placeholder="Szukaj miejscowości lub ulicy..." style="width:100%;">

    <label><input type="checkbox" id="chkStacjonarne" checked> Stacjonarne</label>
    <label><input type="checkbox" id="chkOPP" checked> OPP</label>
    <label><input type="checkbox" id="chkRedlight" checked> Red-light</label>
    <label><input type="checkbox" id="chkHeatmap"> Heatmap</label>

    <button id="btnOPP">Start OPP (pierwszy)</button>
    <button id="btnStyle">Zmień styl mapy</button>
    <button id="btnTheme">Tryb jasny/ciemny</button>

    <h3>Statystyki</h3>
    <div id="stats"></div>

    <h3>Wykres kołowy</h3>
    <canvas id="chart" width="220" height="220"></canvas>

    <h3>Legenda</h3>
    <div class="legend">
      <div><span class="icon">📍</span> Stacjonarne</div>
      <div><span class="icon">🚗</span> OPP – początek</div>
      <div><span class="icon">🏁</span> OPP – koniec</div>
      <div><span class="icon">🚦</span> Red-light</div>
    </div>

    <h3>Lista radarów</h3>
    <div id="radarList" class="radar-list"></div>

    <h3>Odcinki OPP</h3>
    <div id="oppList" class="opp-list"></div>
  </div>

  <div id="map"></div>

</div>

<script>
  let currentStyle = 'osm';
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'© OpenStreetMap'
  });
  const sat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    maxZoom:19, subdomains:['mt0','mt1','mt2','mt3']
  });

  const map = L.map('map', { layers:[osm] }).setView([54.35, 18.65], 9);

  let markersCluster = L.markerClusterGroup();
  let heatLayer = null;
  let oppPairs = [];

  const oppInfo = {
    "OPP – Borowo (DW211)": { car: 50, truck: 50 },
    "OPP – Borcz – Babi Dół (DK20)": { car: 90, truck: 70 },
    "OPP – Reda – Rekowo Górne (DW216)": { car: 60, truck: 60 },
    "OPP – S6 Gdańsk Lotnisko – Park Gdańsk": { car: 120, truck: 80 },
    "OPP – S6 Matarnia – Owczarnia": { car: 120, truck: 80 },
    "OPP – S7 Węzeł Dworek – Nowy Dwór Gdański": { car: 120, truck: 80 }
  };

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  fetch('radars.json')
    .then(r => r.json())
    .then(radars => {

      const heatPoints = [];
      const radarList = document.getElementById('radarList');
      const oppList = document.getElementById('oppList');

      const uniqueRadars = radars.filter((r, i, arr) =>
        arr.findIndex(x => x.name === r.name && x.lat === r.lat && x.lon === r.lon) === i
      );

      uniqueRadars.forEach(r => {
        const color =
          r.type === 'stacjonarny' ? 'blue' :
          r.type === 'opp_start' ? 'green' :
          r.type === 'opp_end' ? 'red' :
          r.type === 'redlight' ? 'orange' : 'gray';

        const marker = L.circleMarker([r.lat, r.lon], {
          radius:6, color, fillColor:color, fillOpacity:0.8
        }).bindPopup(`${r.name}<br>${r.note}`);

        marker.type = r.type;
        marker.town = r.town;
        markersCluster.addLayer(marker);

        heatPoints.push([r.lat, r.lon, 0.5]);

        if (r.type === "stacjonarny" || r.type === "redlight") {
          const item = document.createElement('div');
          item.className = 'radar-item';
          item.textContent = r.name;
          item.onclick = () => {
            map.setView([r.lat, r.lon], 13);
            marker.openPopup();
          };
          radarList.appendChild(item);
        }
      });

      map.addLayer(markersCluster);
      heatLayer = L.heatLayer(heatPoints, { radius:25 });

      const starts = radars.filter(r => r.type === "opp_start");
      const ends = radars.filter(r => r.type === "opp_end");

      starts.forEach(start => {
        const end = ends.find(e => e.name === start.name);
        if (!end) return;

        const meta = oppInfo[start.name] || { car: "?", truck: "?" };
        const lengthKm = haversine(start.lat, start.lon, end.lat, end.lon);

        const pair = { start, end, meta, lengthKm };
        oppPairs.push(pair);

        const line = L.polyline([[start.lat, start.lon], [end.lat, end.lon]], {
          color:"red", weight:3, opacity:0.6
        }).addTo(map);

        line.bindTooltip(
          `${start.name}<br>Długość: ${lengthKm.toFixed(2)} km<br>` +
          `Osobowe: ${meta.car} km/h<br>` +
          `Ciężarowe: ${meta.truck} km/h`,
          { permanent:false }
        );

        const oppItem = document.createElement('div');
        oppItem.className = 'opp-item';
        oppItem.textContent =
          `${start.name} – ${lengthKm.toFixed(2)} km ` +
          `(Osobowe: ${meta.car} km/h, Ciężarowe: ${meta.truck} km/h)`;
        oppItem.onclick = () => {
          map.fitBounds([[start.lat, start.lon], [end.lat, end.lon]]);
          animateOPP(pair, true);
        };
        oppList.appendChild(oppItem);
      });

      updateStats(radars);
      drawChart(radars);
    });

  document.getElementById("search").oninput = e => {
    const q = e.target.value.toLowerCase();
    markersCluster.clearLayers();
    fetch('radars.json').then(r => r.json()).then(radars => {
      radars.forEach(r => {
        if (r.town.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)) {
          const color =
            r.type === 'stacjonarny' ? 'blue' :
            r.type === 'opp_start' ? 'green' :
            r.type === 'opp_end' ? 'red' :
            r.type === 'redlight' ? 'orange' : 'gray';
          const marker = L.circleMarker([r.lat, r.lon], {
            radius:6, color, fillColor:color, fillOpacity:0.8
          }).bindPopup(`${r.name}<br>${r.note}`);
          markersCluster.addLayer(marker);
        }
      });
      map.addLayer(markersCluster);
    });
  };

  document.getElementById("chkHeatmap").onchange = e => {
    if (e.target.checked) heatLayer.addTo(map);
    else map.removeLayer(heatLayer);
  };

  document.getElementById("btnStyle").onclick = () => {
    if (currentStyle === 'osm') {
      map.removeLayer(osm);
      map.addLayer(sat);
      currentStyle = 'sat';
    } else {
      map.removeLayer(sat);
      map.addLayer(osm);
      currentStyle = 'osm';
    }
  };

  document.getElementById("btnTheme").onclick = () => {
    document.getElementById('panel').classList.toggle('dark');
  };

  document.getElementById("btnOPP").onclick = () => {
    if (oppPairs.length === 0) return;
    animateOPP(oppPairs[0], true);
  };

  function animateOPP(opp, zoom) {
    const start = opp.start;
    const end = opp.end;

    if (zoom) {
      map.fitBounds([[start.lat, start.lon], [end.lat, end.lon]]);
    }

    const line = L.polyline([[start.lat, start.lon], [end.lat, end.lon]], {
      color:"red", weight:4, opacity:0.9
    }).addTo(map);

    const movingMarker = L.circleMarker([start.lat, start.lon], {
      radius:8, color:"yellow", fillColor:"yellow", fillOpacity:1
    }).addTo(map);

    let progress = 0;
    let grow = true;

    const interval = setInterval(() => {
      progress += 0.005;
      if (progress >= 1) {
        clearInterval(interval);
        map.removeLayer(line);
        map.removeLayer(movingMarker);
        return;
      }
      const lat = start.lat + (end.lat - start.lat) * progress;
      const lon = start.lon + (end.lon - start.lon) * progress;
      movingMarker.setLatLng([lat, lon]);

      const r = movingMarker.options.radius;
      movingMarker.setStyle({ radius: grow ? r + 0.3 : r - 0.3 });
      if (r > 10) grow = false;
      if (r < 8) grow = true;
    }, 30);
  }

  function updateStats(radars) {
    const s = radars.filter(r => r.type === "stacjonarny").length;
    const o = radars.filter(r => r.type === "opp_start").length;
    const rl = radars.filter(r => r.type === "redlight").length;

    document.getElementById("stats").innerHTML =
      `Stacjonarne: ${s}<br>OPP: ${o}<br>Red-light: ${rl}`;
  }

  function drawChart(radars) {
    const ctx = document.getElementById("chart").getContext("2d");

    const s = radars.filter(r => r.type === "stacjonarny").length;
    const o = radars.filter(r => r.type === "opp_start").length;
    const rl = radars.filter(r => r.type === "redlight").length;

    const total = s + o + rl;
    const data = [s, o, rl];
    const colors = ["blue", "green", "orange"];

    let startAngle = 0;

    for (let i = 0; i < data.length; i++) {
      const sliceAngle = (data[i] / total) * 2 * Math.PI;

      ctx.beginPath();
      ctx.moveTo(110, 110);
      ctx.arc(110, 110, 100, startAngle, startAngle + sliceAngle);
      ctx.closePath();
      ctx.fillStyle = colors[i];
      ctx.fill();

      startAngle += sliceAngle;
    }
  }
</script>

</body>
</html>
