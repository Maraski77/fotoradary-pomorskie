<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Mapa fotoradarów – Pomorskie</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Heatmap -->
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<style>
  body { margin:0; font-family:Arial; }
  #map { height: 80vh; width: 100%; }
  .panel { padding: 10px; background:#f5f5f5; }
</style>
</head>

<body>

<div class="panel">
  <h2>Fotoradary – Pomorskie</h2>

  <label><input type="checkbox" id="chkStacjonarne" checked> Stacjonarne</label>
  <label><input type="checkbox" id="chkOPP" checked> OPP</label>
  <label><input type="checkbox" id="chkRedlight" checked> Red-light</label>
  <label><input type="checkbox" id="chkHeatmap"> Heatmap</label>

  <br><br>
  <button id="btnOPP">Start OPP</button>

  <h3>Statystyki</h3>
  <div id="stats"></div>

  <h3>Wykres kołowy</h3>
  <canvas id="chart" width="300" height="300"></canvas>
</div>

<div id="map"></div>

<script>
  /* --- Inicjalizacja mapy --- */
  const map = L.map('map').setView([54.35, 18.65], 9);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  let markers = [];
  let heatLayer = null;
  let oppPairs = [];

  /* --- Wczytanie danych --- */
  fetch('radars.json')
    .then(r => r.json())
    .then(radars => {
      const heatPoints = [];

      radars.forEach(r => {
        const color =
          r.type === 'stacjonarny' ? 'blue' :
          r.type === 'opp_start' ? 'green' :
          r.type === 'opp_end' ? 'red' :
          r.type === 'redlight' ? 'orange' : 'gray';

        const marker = L.circleMarker([r.lat, r.lon], {
          radius: 6,
          color: color,
          fillColor: color,
          fillOpacity: 0.8
        }).bindPopup(`${r.name}<br>${r.note}`);

        marker.type = r.type;
        marker.addTo(map);
        markers.push(marker);

        heatPoints.push([r.lat, r.lon, 0.5]);
      });

      /* --- Heatmap --- */
      heatLayer = L.heatLayer(heatPoints, { radius: 25 });

      /* --- Parowanie OPP --- */
      const starts = radars.filter(r => r.type === "opp_start");
      const ends = radars.filter(r => r.type === "opp_end");

      for (let i = 0; i < starts.length; i++) {
        oppPairs.push({ start: starts[i], end: ends[i] });
      }

      updateStats(radars);
      drawChart(radars);
    });

  /* --- Statystyki --- */
  function updateStats(radars) {
    const s = radars.filter(r => r.type === "stacjonarny").length;
    const o = radars.filter(r => r.type === "opp_start").length;
    const rl = radars.filter(r => r.type === "redlight").length;

    document.getElementById("stats").innerHTML =
      `Stacjonarne: ${s}<br>OPP: ${o}<br>Red-light: ${rl}`;
  }

  /* --- Wykres kołowy --- */
  function drawChart(radars) {
    const ctx = document.getElementById("chart").getContext("2d");

    const s = radars.filter(r => r.type === "stacjonarny").length;
    const o = radars.filter(r => r.type === "opp_start").length;
    const rl = radars.filter(r => r.type === "redlight").length;

    const total = s + o + rl;

    const data = [s, o, rl];
    const colors = ["blue", "green", "orange"];

    let startAngle = 0;

    for (let i = 0; i < data.length; i++) {
      const sliceAngle = (data[i] / total) * 2 * Math.PI;

      ctx.beginPath();
      ctx.moveTo(150, 150);
      ctx.arc(150, 150, 150, startAngle, startAngle + sliceAngle);
      ctx.closePath();
      ctx.fillStyle = colors[i];
      ctx.fill();

      startAngle += sliceAngle;
    }
  }

  /* --- Animacja OPP --- */
  document.getElementById("btnOPP").onclick = () => {
    if (oppPairs.length === 0) return;

    const opp = oppPairs[0];
    const line = L.polyline([[opp.start.lat, opp.start.lon], [opp.end.lat, opp.end.lon]], {
      color: "red",
      weight: 4
    }).addTo(map);

    let t = 0;
    const interval = setInterval(() => {
      t += 0.01;
      if (t >= 1) {
        clearInterval(interval);
        map.removeLayer(line);
      }
    }, 30);
  };

  /* --- Filtry --- */
  document.getElementById("chkHeatmap").onchange = e => {
    if (e.target.checked) heatLayer.addTo(map);
    else map.removeLayer(heatLayer);
  };
</script>

</body>
</html>
